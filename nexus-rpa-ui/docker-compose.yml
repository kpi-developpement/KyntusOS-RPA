version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus_db
    environment:
      POSTGRES_USER: kyntus_user
      POSTGRES_PASSWORD: kyntus_password
      POSTGRES_DB: nexus_rpa_db
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  nexus-api:
    build:
      context: ../
      dockerfile: Dockerfile.api
    container_name: nexus_master_api
    ports:
      - "9833:9833"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexus_rpa_db
    restart: unless-stopped
    depends_on:
      - postgres

  nexus-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nexus_web_dashboard
    ports:
      - "3644:3644"
    environment:
      - NODE_ENV=production
      - PORT=3644
    restart: unless-stopped
    depends_on:
      - nexus-api

volumes:
  pgdata: